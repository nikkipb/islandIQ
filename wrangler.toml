name = "islandiq"
main = "worker/index.ts"
compatibility_date = "2025-09-01"

# Built front end (npm run build). Files are served directly; everything else
# (the /api routes) goes to worker/index.ts.
[assets]
directory = "./dist"
binding = "ASSETS"

[vars]
# "1" unlocks every issue (archive + future). Set to "0" for launch.
PREVIEW = "1"

[[d1_databases]]
binding = "DB"
database_name = "islandiq"
database_id = "fa9d259b-9a7b-43db-92f0-838dfcfea48a"
migrations_dir = "migrations"
