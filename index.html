<!doctype html>
<html lang="en-MT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>IslandIQ · The daily Maltese numbers game</title>
  <meta name="description" content="Three Maltese numbers a day. One guess each. Every answer comes with its official source.">
  <meta name="theme-color" content="#E4E6E2">
  <meta property="og:title" content="IslandIQ">
  <meta property="og:description" content="Three Maltese numbers a day. How close can you get?">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    // Apply the saved theme before first paint so night players never get a white flash.
    try { var t = localStorage.getItem("islandiq-theme"); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <header class="mast">
      <a class="mark" href="/" aria-label="IslandIQ, today's issue">Island<span class="plate">IQ</span></a>
      <div class="issue" id="issue"></div>
      <button class="icon" id="open-archive" aria-label="Past issues">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      </button>
      <button class="icon" id="theme" aria-label="Switch to dark mode">
        <svg viewBox="0 0 24 24" id="theme-icon"></svg>
      </button>
    </header>
    <main class="board" id="board" aria-live="polite"><div class="loading">Loading today's issue…</div></main>
    <div class="dock" id="dock"></div>
  </div>

  <dialog class="sheet" id="archive" aria-labelledby="archive-title">
    <div class="sheet-in">
      <div class="sheet-head">
        <h3 id="archive-title">Every issue</h3>
        <button class="icon" id="close-archive" aria-label="Close">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="sheet-body">
        <p id="archive-note"></p>
        <div class="days" id="days"></div>
        <div class="mydata">
          <span>Your player ID <code id="pid"></code></span>
          <button class="link" id="forget">Delete my data</button>
        </div>
        <div id="archive-ad"></div>
        <nav class="legal"><a href="/about">About</a><a href="/privacy">Privacy</a><a href="/cookies">Cookies</a><a href="/terms">Terms</a><button class="link" id="consent">Privacy settings</button></nav>
      </div>
    </div>
  </dialog>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
